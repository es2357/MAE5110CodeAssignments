[project]
name = "mae5110-animations"
version = "0.1.0"
description = "Standalone rimless-wheel motion and energy animations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "pillow",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
